<div class="attention-entry-field{% if full_width %} attention-entry-field-full{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
        <div class="form-check">{{ field }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
    {% else %}
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="attention-entry-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors }}</div>{% endif %}
</div>
