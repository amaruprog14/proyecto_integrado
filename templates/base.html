{% load django_bootstrap5 %}
<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}EcoEnergy{% endblock %}</title>
        {% bootstrap_css %}
    </head>
    <body class="bg-light d-flex flex-column min-vh-100">
        <nav
            class="navbar navbar-expand-lg bg-white border-bottom shadow-sm sticky-top"
            aria-label="Navegación principal"
        >
            <div class="container">
                <a
                    class="navbar-brand d-flex align-items-center gap-2 fw-bold text-success"
                    href="{% url 'dispositivos:inicio' %}"
                >
                    <span
                        class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success text-white"
                        style="width: 2rem; height: 2rem"
                        aria-hidden="true"
                    >
                        E
                    </span>
                    EcoEnergy
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navegacionPrincipal"
                    aria-controls="navegacionPrincipal"
                    aria-expanded="false"
                    aria-label="Mostrar navegación"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navegacionPrincipal">
                    <div class="navbar-nav ms-auto">
                        <!--<a class="nav-link px-lg-3" href="{% url 'dispositivos:inicio' %}">Inicio</a>-->
                        <!--<a class="nav-link px-lg-3" href="{% url 'dispositivos:zonas' %}">Zonas</a>-->
                        <!--<a class="nav-link px-lg-3" href="{% url 'dispositivos:catalogo' %}">Dispositivos</a>-->
                    </div>
                </div>
            </div>
        </nav>

        <main class="container py-4 py-md-5 flex-grow-1">{% block content %}{% endblock %}</main>

        <footer class="border-top bg-white py-4">
            <div class="container small text-body-secondary text-center">EcoEnergy · Gestión energética</div>
        </footer>
        {% bootstrap_javascript %}
    </body>
</html>
